<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    .card { background: var(--tg-theme-secondary-bg-color, #f5f5f5); border-radius: 10px; padding: 16px; margin-top: 16px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #eee; }
    .row:last-child { border-bottom: none; }
    .label { opacity: 0.6; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
    #btn-delete { background: #e74c3c; color: #fff; }
    #btn-cancel { background: var(--tg-theme-secondary-bg-color, #eee); color: var(--tg-theme-text-color, #333); }
    #error { color: red; margin-top: 10px; display: none; font-size: 13px; }
    #loading { text-align: center; margin-top: 40px; opacity: 0.6; }
  </style>
</head>
<body>
  <h2>Undo Last Record</h2>
  <div id="error"></div>
  <div id="loading">Loading...</div>

  <div id="content" style="display:none">
    <div class="card">
      <div class="row"><span class="label">Date</span><span id="r-date"></span></div>
      <div class="row"><span class="label">Ledger</span><span id="r-ledger"></span></div>
      <div class="row"><span class="label">Type</span><span id="r-type"></span></div>
      <div class="row"><span class="label">Category</span><span id="r-category"></span></div>
      <div class="row"><span class="label">Amount</span><span id="r-amount"></span></div>
      <div class="row"><span class="label">Description</span><span id="r-desc"></span></div>
    </div>

    <div class="btn-row">
      <button id="btn-delete" onclick="deleteRecord()">🗑 Delete</button>
      <button id="btn-cancel" onclick="tg.close()">Cancel</button>
    </div>
  </div>

  <script src="../static/app.js"></script>
  <script>
    let recordID = null;

    async function init() {
      const res = await apiFetch("/api/expenses/latest");
      document.getElementById("loading").style.display = "none";
      if (!res.ok) {
        showError("No recent record found.");
        return;
      }
      const data = await res.json();
      recordID = data.id;

      document.getElementById("r-date").textContent = data.date;
      document.getElementById("r-ledger").textContent = data.ledger_name;
      document.getElementById("r-type").textContent = data.type;
      document.getElementById("r-category").textContent = data.category_code;
      document.getElementById("r-amount").textContent = data.amount + " " + data.currency + " (" + data.amount_in_base.toFixed(2) + " " + data.base_currency + ")";
      document.getElementById("r-desc").textContent = data.description || "—";
      document.getElementById("content").style.display = "block";
    }

    async function deleteRecord() {
      if (!recordID) return;
      const id = recordID;
      recordID = null;
      document.getElementById("btn-delete").disabled = true;
      const res = await apiFetch(`/api/expenses/${id}`, { method: "DELETE" });
      if (!res.ok) {
        recordID = id;
        document.getElementById("btn-delete").disabled = false;
        showError("Failed to delete record.");
        return;
      }
      tg.close();
    }

    init();
  </script>
</body>
</html>
